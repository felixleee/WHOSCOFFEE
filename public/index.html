    <div class="modal-t">설정</div>
    <div class="set-list">
      <button class="set-row" id="setTheme">
        <span class="set-txt"><span class="set-main">테마</span><span class="set-sub">라이트 / 다크</span></span>
        <span class="set-val" id="setThemeVal"></span>
      </button>
      <button class="set-row" id="setPoll">
        <span class="set-txt"><span class="set-main">새로고침 주기</span><span class="set-sub">자동 갱신 간격</span></span>
        <span class="set-val" id="setPollVal"></span>
      </button>
    </div>
    <div class="set-sec">알림</div>
    <div class="notif-opts">
      <button class="notif-opt" data-nk="turn">
        <span class="no-txt"><span class="no-main">내 차례 알림</span><span class="no-sub">상대가 품앗이하면 알려줘요</span></span>
        <span class="no-check">✓</span>
      </button>
      <button class="notif-opt" data-nk="daily">
        <span class="no-txt"><span class="no-main">매일 정오 알림</span><span class="no-sub">낮 12시에 오늘 살 사람을 알려줘요</span></span>
        <span class="no-check">✓</span>
      </button>
    </div>
    <div class="notif-hint" id="notifHint"></div>
    <div class="modal-row"><button class="m-btn m-cancel" id="settingsCancel">닫기</button></div>
  </div>
</div>
<div id="renameModal" class="modal">
  <div class="modal-card">
    <div class="modal-t">이름 바꾸기</div>
    <input type="text" id="renameInput" maxlength="20" placeholder="새 이름" />
    <div class="modal-row">
      <button class="m-btn m-cancel" id="renameCancel">취소</button>
      <button class="m-btn m-ok" id="renameOk">저장</button>
    </div>
  </div>
</div>
<div id="turnModal" class="turn-modal">
  <div class="turn-card">
    <svg class="turn-cup" width="72" height="66" viewBox="0 0 100 96" aria-hidden="true"><path d="M38 20 C33 13 43 9 38 2" fill="none" stroke="var(--brand-soft)" stroke-width="3.5" stroke-linecap="round"/><path d="M54 20 C49 13 59 9 54 2" fill="none" stroke="var(--brand-soft)" stroke-width="3.5" stroke-linecap="round"/><path d="M22 34 H74 V62 A20 20 0 0 1 54 82 H42 A20 20 0 0 1 22 62 Z" fill="var(--brand)"/><path d="M74 42 H84 A12 12 0 0 1 84 68 H74" fill="none" stroke="var(--brand)" stroke-width="6"/><circle cx="40" cy="56" r="3.5" fill="var(--card)"/><circle cx="56" cy="56" r="3.5" fill="var(--card)"/><path d="M43 66 Q48 70 53 66" fill="none" stroke="var(--card)" stroke-width="2.6" stroke-linecap="round"/></svg>
    <p class="turn-h">☕ 내 차례가 돌아왔어요!</p>
    <p class="turn-s" id="turnSub"></p>
    <button class="turn-btn" id="turnOk">오케이 ☕</button>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');

// 처리 중 오버레이 (흰 반투명 + 원두 스핀). 빠른 요청엔 안 뜨게 120ms 지연 후 표시, 렌더 시 해제.
const busyOverlay = $('#busyOverlay');
let busyTimer = null;
function showBusy() {
  if (busyTimer) return;
  busyTimer = setTimeout(() => { busyTimer = null; if (busyOverlay) busyOverlay.classList.add('show'); }, 120);
}
function hideBusy() {
  if (busyTimer) { clearTimeout(busyTimer); busyTimer = null; }
  if (busyOverlay) busyOverlay.classList.remove('show', 'solid');
}
const BEAN = `<svg width="46" height="46" viewBox="0 0 100 100" style="margin:0 auto 6px;display:block" aria-hidden="true"><g transform="rotate(-30 40 38)"><ellipse cx="40" cy="38" rx="11" ry="15" fill="var(--brand)"/><path d="M40 25 C36 31 44 45 40 51" fill="none" stroke="var(--card)" stroke-width="2.6" stroke-linecap="round"/></g><g transform="rotate(-30 60 62)"><ellipse cx="60" cy="62" rx="11" ry="15" fill="var(--brand)"/><path d="M60 49 C56 55 64 69 60 75" fill="none" stroke="var(--card)" stroke-width="2.6" stroke-linecap="round"/></g></svg>`;

// 테마 토글 (시스템 무시, 수동 선택 + localStorage 유지)
const THEME_KEY = 'wc_theme';
const curTheme = () => document.documentElement.getAttribute('data-theme') || 'light';
function toggleTheme() {
  const next = curTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
  updateSettingsUI();
}
const TOKEN_KEY = 'wc_token';
const STATE_KEY = 'wc_last_state';
const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
const setToken = (t) => t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY);

// ---- 기록 뷰(리스트/달력) ----
let recView = (() => { try { return localStorage.getItem('wc_recview') || 'list'; } catch (e) { return 'list'; } })();
let histCache = null;   // 전체 기록 캐시 [{date,name,avatar,isMe,note}]
let calYM = null;       // 보고 있는 달 {y, m(0-11)}
let lastOffline = false; // 뷰 토글 시 재렌더용 (lastState는 아래에서 선언)
function defaultMonth() { // 항상 이번 달 기준(KST=브라우저 로컬)
  const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() };
}
async function ensureHistory() {
  if (histCache) return;
  try {
    const r = await api('/api/history');
    histCache = r.events || [];
    if (!calYM) calYM = defaultMonth();
    if (recView === 'calendar' && lastState) renderMain(lastState, lastOffline);
  } catch (e) { /* 오프라인 등 — 조용히 무시 */ }
}
function setRecView(v) {
  recView = v; try { localStorage.setItem('wc_recview', v); } catch (e) { }
  if (v === 'calendar' && !histCache) ensureHistory();
  if (lastState) renderMain(lastState, lastOffline);
}
function shiftMonth(delta) {
  if (!calYM) calYM = defaultMonth();
  let y = calYM.y, m = calYM.m + delta;
  while (m < 0) { m += 12; y--; } while (m > 11) { m -= 12; y++; }
  calYM = { y, m };
  if (lastState) renderMain(lastState, lastOffline);
}
function calChip(e) {
  const cls = e.isMe ? 'me' : 'you';
  const inner = e.avatar ? `<img src="${e.avatar}" alt="" />` : esc(((e.name || '?').trim().charAt(0)) || '?');
  return `<span class="cal-chip ${cls}" title="${esc(e.name || '')}">${inner}</span>`;
}
function recChip(e) { // 리스트 행 이름 앞 원형 칩(프사 우선·없으면 이니셜)
  const cls = e.isMe ? 'me' : 'you';
  const inner = e.avatar ? `<img src="${e.avatar}" alt="" />` : esc(((e.name || '?').trim().charAt(0)) || '?');
  return `<span class="rec-chip ${cls}">${inner}</span>`;
}
function calendarHTML() {
  if (!histCache) return `<div class="cal-loading">불러오는 중…</div>`;
  if (!calYM) calYM = defaultMonth();
  const { y, m } = calYM;
  const byDay = {}; let cMe = 0, cYou = 0;
  histCache.forEach(e => { const p = e.date.split('-'); if (+p[0] === y && +p[1] === m + 1) { (byDay[+p[2]] = byDay[+p[2]] || []).push(e); e.isMe ? cMe++ : cYou++; } });
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += `<div></div>`;
  for (let d = 1; d <= days; d++) {
    const evs = byDay[d]; const dow = (first + d - 1) % 7;
    let marks = '';
    if (evs) { marks = evs.slice(0, 3).map(calChip).join(''); if (evs.length > 3) marks += `<span class="cal-more">+${evs.length - 3}</span>`; }
    cells += `<div class="cal-cell ${evs ? 'has' : ''}"><span class="cal-dnum ${dow === 0 ? 'sun' : ''}">${d}</span><span class="cal-marks">${marks}</span></div>`;
  }
  const wd = ['일', '월', '화', '수', '목', '금', '토'].map((w, i) => `<span class="${i === 0 ? 'sun' : ''}">${w}</span>`).join('');
  const meM = lastState && lastState.me || {}, youM = lastState && lastState.mate || {};
  const meName = esc(meM.name || '나'), youName = esc(youM.name || '상대');
  const sumMark = (cls, avatar) => avatar
    ? `<span class="cal-dot ${cls} img"><img src="${avatar}" alt="" /></span>`
    : `<span class="cal-dot ${cls}"></span>`;
  return `<div class="cal-nav"><button id="calPrev" aria-label="이전 달">‹</button>
      <span class="cal-title">${y}년 ${m + 1}월</span>
      <button id="calNext" aria-label="다음 달">›</button></div>
    <div class="cal-wd">${wd}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-sum"><span class="s">${sumMark('me', meM.avatar)}${meName} <b>${cMe}</b></span>
      <span class="s">${sumMark('you', youM.avatar)}${youName} <b>${cYou}</b></span></div>`;
}

let pollTimer = null;
let busy = false; // 도장 애니메이션·요청 중이면 폴링 skip

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function fmtDate(iso) { const [, m, d] = iso.split('-'); return `${+m}/${+d}`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1900); }
async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), 'X-Token': getToken() };
  let res;
  try { res = await fetch(path, opts); }
  catch (_) { const err = new Error('서버에 연결할 수 없어요'); err.offline = true; throw err; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '오류가 발생했어요');
  return data;
}
const jsonPost = async (path, body, opts) => {
  const quiet = opts && opts.noBusy; // 도장 등 자체 애니가 있는 액션은 오버레이 생략
  if (!quiet) showBusy();
  try {
    return await api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  } catch (e) {
    if (!quiet) hideBusy();
    throw e;
  }
  // 성공 시엔 유지 — 뒤이은 render()에서 hideBusy() 로 해제(반영 완료까지 표시)
};

const POLL_KEY = 'wc_poll';
const POLL_OPTS = [
  { key: '5s', label: '5초', ms: 5000 },
  { key: '1m', label: '1분', ms: 60000 },
  { key: '30m', label: '30분', ms: 1800000 },
  { key: '1h', label: '1시간', ms: 3600000 },
  { key: '12h', label: '12시간', ms: 43200000 },
  { key: '1d', label: '하루', daily: true },
];
const getPollKey = () => { try { return localStorage.getItem(POLL_KEY) || '1d'; } catch (e) { return '1d'; } };
const curPollOpt = () => POLL_OPTS.find(o => o.key === getPollKey()) || POLL_OPTS[5];
let pollOn = false;
function scheduleDaily() {
  const now = new Date();
  const next = new Date(now); next.setHours(12, 0, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  pollTimer = setTimeout(() => { doRefresh(true); if (pollOn) scheduleDaily(); }, next - now);
}
function setPoll(on) {
  pollOn = on;
  if (pollTimer) { clearTimeout(pollTimer); clearInterval(pollTimer); pollTimer = null; }
  if (!on) return;
  const o = curPollOpt();
  if (o.daily) scheduleDaily();
  else pollTimer = setInterval(() => doRefresh(true), o.ms);
}
const pollRefresh = $('#pollRefresh');
const pollCycle = $('#pollCycle');
const updatePollLabel = () => { const tx = pollCycle && pollCycle.querySelector('.tx'); if (tx) tx.textContent = curPollOpt().label; };

// 새로고침 아이콘: 즉시 새로고침 + 회전 효과(최소 회전시간 보장)
let refreshing = false;
async function doRefresh(isPoll) {
  if (refreshing || busy) return;
  refreshing = true;
  if (pollRefresh) pollRefresh.classList.add('spinning');
  const started = Date.now();
  try { await load(isPoll); }
  finally {
    const wait = Math.max(0, 650 - (Date.now() - started));
    setTimeout(() => { if (pollRefresh) pollRefresh.classList.remove('spinning'); refreshing = false; }, wait);
  }
}
// 강제 새로고침: 캐시(Storage) 삭제 + 잔여 SW 해제 + 전체 리로드. 설치형 PWA는 강력 새로고침이 없어 이걸로 앱 업데이트/캐시 문제 해결
async function hardReload() {
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) { }
  try { if ('serviceWorker' in navigator) { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } } catch (e) { } // SW 최신화(해제 안 함 → 네트워크 전용이라 안전, 푸시 구독 유지)
  location.reload(); // index.html 은 max-age=0, must-revalidate → 리로드 시 최신으로 재검증(?r= 쿼리 안 붙여 standalone 높이 이슈 회피)
}
// 탭: 가벼운 데이터 새로고침(상단 스피너만) · 길게 누르기: 강제 새로고침(전체 리로드)
// 새로고침 버튼: 가벼운 데이터 새로고침만(강제 새로고침은 커피빈 로고 2초 홀드로 이동)
if (pollRefresh) pollRefresh.onclick = () => doRefresh(false);
// 커피빈 로고 2초 길게 누르기 → 로고가 스피너처럼 감기다가 강력 새로고침(설치형 PWA 강력새로고침 대안)
const heroLogo = document.querySelector('h1 .logo-mark');
if (heroLogo) {
  let logoTimer = null;
  const logoStart = () => {
    if (logoTimer) return;
    heroLogo.classList.add('charging');
    logoTimer = setTimeout(() => {
      logoTimer = null;
      const r = heroLogo.getBoundingClientRect();
      const dx = Math.round(window.innerWidth / 2 - (r.left + r.width / 2));
      const dy = Math.round(window.innerHeight / 2 - (r.top + r.height / 2));
      busyOverlay.classList.add('show', 'solid', 'no-bean'); // 베이지 로딩 배경(원두는 숨김 — 날아온 로고가 대신)
      busyOverlay.style.opacity = '0';
      busyOverlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 560, easing: 'ease-in', fill: 'forwards' }); // 원두 이동에 맞춰 배경 서서히 진해짐
      heroLogo.classList.remove('charging');
      heroLogo.style.visibility = 'hidden'; // 원본 숨김 → 복제본이 중앙으로 날아감(SVG transition 이슈 회피 위해 div+WAAPI)
      const fly = document.createElement('div');
      fly.style.cssText = `position:fixed; left:${r.left}px; top:${r.top}px; width:${r.width}px; height:${r.height}px; margin:0; z-index:70; color:${getComputedStyle(heroLogo).color}; pointer-events:none;`;
      const clone = heroLogo.cloneNode(true);
      clone.removeAttribute('class'); clone.style.cssText = 'width:100%; height:100%; display:block;';
      fly.appendChild(clone);
      document.body.appendChild(fly);
      const beanEl = document.querySelector('.busy-bean');
      const spinnerPx = beanEl ? parseFloat(beanEl.getAttribute('width')) : 52;
      const endScale = spinnerPx / r.width; // 도착 크기를 로딩 스피너와 일치 → 미니(28px)는 로고가 커지며 오고, 전체(46px)는 그대로
      fly.animate([
        { transform: 'translate(0px,0px) rotate(0deg) scale(1.12)' },
        { transform: `translate(${dx}px, ${dy}px) rotate(900deg) scale(${endScale})` } // 헤더 → 화면 중앙으로 회전+스피너 크기에 맞춰 이동
      ], { duration: 640, easing: 'cubic-bezier(.35,.1,.25,1)', fill: 'forwards' });
      setTimeout(hardReload, 660); // 중앙 도착 후 강력 새로고침(리로드 오버레이 원두 스피너로 연결)
    }, 2000);
  };
  const logoCancel = () => {
    if (logoTimer) { clearTimeout(logoTimer); logoTimer = null; }
    heroLogo.classList.remove('charging');
  };
  heroLogo.addEventListener('pointerdown', logoStart);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => heroLogo.addEventListener(ev, logoCancel));
}

// 우상단 기어 → 설정 모달
if ($('#settingsBtn')) $('#settingsBtn').onclick = openSettings;
// 설정: 테마 토글
if ($('#setTheme')) $('#setTheme').onclick = () => toggleTheme();
// 설정: 새로고침 주기 → 주기 선택 모달(설정은 닫고 그 위에)
if ($('#setPoll')) $('#setPoll').onclick = () => {
  $('#settingsModal').classList.remove('show');
  const m = $('#pollModal');
  m.querySelectorAll('[data-pk]').forEach(b => b.classList.toggle('sel', b.dataset.pk === getPollKey()));
  m.classList.add('show');
};
$('#pollModal').querySelectorAll('[data-pk]').forEach(b => b.onclick = () => {
  try { localStorage.setItem(POLL_KEY, b.dataset.pk); } catch (e) { }
  updateSettingsUI();
  $('#pollModal').classList.remove('show');
  setPoll(pollOn);
});
$('#pollCancel').onclick = () => $('#pollModal').classList.remove('show');
// 설정 > 알림 토글: (켤 때) 구독 확인 후 취향 저장·서버 동기화
document.querySelectorAll('#settingsModal .notif-opt').forEach(b => b.onclick = async () => {
  if (!pushSupported()) { updateNotifHint(); return; } // 이 기기 푸시 미지원
  const key = b.dataset.nk, p = getNotifPrefs(), next = !p[key];
  if (next && !(await ensureSubscribed())) { updateNotifHint(); return; } // 권한 거부 시 토글 취소
  p[key] = next; b.classList.toggle('on', next);
  setNotifPrefs(p);
  await syncNotifPrefs(p, next); // 방금 켰으면(next=true) 확인 알림 발송
  updateSettingsUI();
});
$('#settingsCancel').onclick = () => $('#settingsModal').classList.remove('show');

// 좌상단 갱신 UI(폴링 알약+갱신시각)는 방에 입장한 상태에서만 표시
const topleft = document.querySelector('.topleft');
const showTop = on => { if (topleft) topleft.style.display = on ? 'flex' : 'none'; };
showTop(false); // 첫 상태 로드 전까진 숨김(방 입장 확인되면 노출)
// 스크롤 시 상단 스크림 페이드인 (브라우저=window, 데스크톱 앱=html 스크롤 모두 window scroll 발생)
const onScrollScrim = () => document.body.classList.toggle('scrolled', (window.scrollY || document.documentElement.scrollTop || 0) > 8);
window.addEventListener('scroll', onScrollScrim, { passive: true });
onScrollScrim();

// 마지막으로 데이터를 성공적으로 불러온 시각 (상대시간 표시)
const pollStamp = $('#pollStamp');
const FETCH_KEY = 'wc_last_fetch';
let lastFetch = (() => { try { return +localStorage.getItem(FETCH_KEY) || 0; } catch (e) { return 0; } })();
function relTime(ts) {
  if (!ts) return '';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 10) return '방금 갱신';
  if (sec < 60) return sec + '초 전 갱신';
  const m = Math.floor(sec / 60); if (m < 60) return m + '분 전 갱신';
  const h = Math.floor(m / 60); if (h < 24) return h + '시간 전 갱신';
  const d = new Date(ts), hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return (h < 48 ? '어제 ' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + hh + ':' + mm + ' 갱신';
}
const updateStamp = () => { if (pollStamp) pollStamp.textContent = relTime(lastFetch); };
const markFetched = () => { lastFetch = Date.now(); try { localStorage.setItem(FETCH_KEY, lastFetch); } catch (e) { } updateStamp(); };
updateStamp();
setInterval(updateStamp, 30000);

function playStamp(name, done) {
  const ov = $('#stampOverlay'), mark = $('#stampMark');
  ov.classList.remove('fade'); ov.classList.add('show');
  mark.classList.remove('stamp-animate'); void mark.offsetWidth; mark.classList.add('stamp-animate');
  setTimeout(() => { ov.classList.add('fade'); setTimeout(() => { ov.classList.remove('show', 'fade'); done && done(); }, 340); }, 1250);
}

function setFoot(html) { const f = document.getElementById('footSwitch'); const v = html || ''; if (f && f.innerHTML !== v) f.innerHTML = v; }

function renameMe(cur) {
  const modal = $('#renameModal'), input = $('#renameInput');
  input.value = cur || '';
  modal.classList.add('show');
  setTimeout(() => { input.focus(); input.select(); }, 40);
  const close = () => { modal.classList.remove('show'); };
  const ok = async () => {
    const t = input.value.trim();
    if (!t || t === cur) { close(); return; }
    close();
    try { await jsonPost('/api/rename', { name: t }); load(); } catch (e) { toast(e.message); }
  };
  $('#renameOk').onclick = ok;
  $('#renameCancel').onclick = close;
  input.onkeydown = e => { if (e.key === 'Enter') ok(); else if (e.key === 'Escape') close(); };
}

function pickAvatar() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      const ctx = c.getContext('2d');
      const sz = Math.min(img.naturalWidth, img.naturalHeight);
      ctx.drawImage(img, (img.naturalWidth - sz) / 2, (img.naturalHeight - sz) / 2, sz, sz, 0, 0, 96, 96);
      const data = c.toDataURL('image/jpeg', 0.72);
      jsonPost('/api/avatar', { avatar: data }).then(load).catch(e => toast(e.message));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => toast('이미지를 읽지 못했어요');
    img.src = URL.createObjectURL(f);
  };
  inp.click();
}

// ---------------- 웹푸시 알림 ----------------
const VAPID_PUBLIC = 'BGxDtl10Cs5Gp3nt8kj6_-rny5fswUUldIMxOzDt7T5bCSeFERKxtXa_Bks2GDoF-XZKHGV61rf1FEP3HWW_Kac';
const NOTIF_UI = true; // 알림 설정 버튼(모달) 노출
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - (b64.length % 4)) % 4);
  const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s), arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
async function currentSub() {
  try { const reg = await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); } catch (_) { return null; }
}
// 알림 취향(기기별) — {turn, daily}. localStorage=UI소스, 서버=발송 기준.
const NOTIF_KEY = 'wc_notif';
const getNotifPrefs = () => { try { return JSON.parse(localStorage.getItem(NOTIF_KEY)) || { turn: false, daily: false }; } catch (e) { return { turn: false, daily: false }; } };
const setNotifPrefs = p => { try { localStorage.setItem(NOTIF_KEY, JSON.stringify(p)); } catch (e) { } };
// 권한 확인 + 미구독이면 구독. 성공 시 true.
async function ensureSubscribed() {
  try {
    if (Notification.permission === 'denied') { toast('알림이 차단돼 있어요. 설정에서 허용해주세요.'); return false; }
    let sub = await currentSub();
    if (!sub) {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('알림 권한이 필요해요.'); return false; }
      const reg = await navigator.serviceWorker.ready;
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC) });
      await jsonPost('/api/subscribe', { subscription: sub.toJSON() }, { noBusy: true });
    }
    return true;
  } catch (e) { toast('알림을 켜지 못했어요. 홈 화면에 설치한 뒤 다시 시도해주세요.'); return false; }
}
// 취향을 서버에 반영. 둘 다 끄면 구독 자체 해제.
async function syncNotifPrefs(p, announce) {
  const sub = await currentSub();
  if (!p.turn && !p.daily) {
    if (sub) { try { await jsonPost('/api/unsubscribe', { endpoint: sub.endpoint }, { noBusy: true }); } catch (_) { } try { await sub.unsubscribe(); } catch (_) { } }
    return;
  }
  // announce=true(방금 켠 경우) → 서버가 확인 알림 발송("이제부터 ~ 알려드릴게요")
  if (sub) { try { await jsonPost('/api/notif-prefs', { endpoint: sub.endpoint, turn: p.turn, daily: p.daily, announce: !!announce }, { noBusy: true }); } catch (_) { } }
}
function updateNotifHint() {
  const h = $('#notifHint'); if (!h) return;
  if (!pushSupported()) { h.textContent = '이 기기에선 알림을 지원하지 않아요.'; return; }
  if (Notification.permission === 'denied') { h.textContent = '알림이 차단돼 있어요. 브라우저 설정에서 허용해주세요.'; return; }
  const p = getNotifPrefs();
  h.textContent = (!p.turn && !p.daily) ? '받고 싶은 알림을 선택해주세요.' : '';
}

// ---------------- 라우팅 ----------------
async function load(isPoll) {
  let s;
  try { s = await api('/api/state'); }
  catch (e) {
    hideBusy(); // 로드 실패 시 초기/액션 스피너가 멈춰 남지 않게
    // 서버가 꺼져 연결 실패 → 마지막으로 본 상태(읽기 전용) 표시, 폴링은 계속(켜지면 자동 복구)
    if (e.offline) {
      const cached = localStorage.getItem(STATE_KEY);
      if (cached) { try { const cs = JSON.parse(cached); notifyNativeMini(miniMode); notifyNativePin(miniMode && pinOn); if (miniMode) { renderMiniMode(cs, true); showTop(true); } else { document.body.classList.remove('mini-mode'); renderMain(cs, true); showTop(true); } setPoll(true); return; } catch (_) { } }
    }
    if (!isPoll) toast(e.message);
    return;
  }
  markFetched(); // 성공적으로 데이터를 받아온 시각 기록
  // 폴링/로드로 마지막 기록이 바뀌면(상대가 사거나 취소 승인 등) 달력 캐시 무효화 → 상대 기록도 달력에 반영
  const evSig = st => st && st.last ? `${st.last.date}|${st.last.name}|${st.last.mine}` : '';
  if (evSig(s) !== evSig(lastState)) histCache = null;
  lastState = s;
  // 온라인 정상: active 상태를 캐시에 저장(오프라인 시 보여줄 마지막 상태)
  if (s.phase === 'active') { try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (_) { } }
  const inRoom = s.phase === 'waiting' || s.phase === 'active';
  notifyNativeMini(miniMode && inRoom); // 앱 창 크기 축소/복원
  notifyNativePin(miniMode && inRoom && pinOn); // 항상-위: 미니일 때만, 전체화면이면 off
  // 미니 모드 + 방 입장 상태면 컴팩트 위젯으로, 아니면 일반 화면
  if (miniMode && inRoom && isApp) {
    showTop(true); // 좌상단 새로고침+갱신시각 (미니에선 컴팩트하게)
    renderMiniMode(s);
    setPoll(true);
  } else {
    document.body.classList.remove('mini-mode');
    showTop(inRoom); // 좌상단 갱신 UI는 방 입장(waiting/active) 때만
    if (s.phase === 'waiting') { renderWaiting(s); setPoll(true); }
    else if (s.phase === 'active') { renderMain(s); setPoll(true); }
    else { renderSetupHome(s); setPoll(false); }
  }
  if (s.phase === 'active') maybeShowTurnPopup(s); // 내 차례 복귀 시 1회성 팝업(미니·전체 공통)
}

  const rowBtns = [];
  if (!offline && isApp) rowBtns.push('<button id="miniBtn">⧉ 미니 플로팅</button>'); // 미니=네이티브 창 축소 → 앱(WebView2)에서만, 모바일/브라우저엔 숨김
  if (!offline && !s.undoReq && s.last && s.last.mine) rowBtns.push('<button id="undo">마지막 기록 취소</button>');
  const minorRow = rowBtns.length ? `<div class="minor-row">${rowBtns.join('<span class="row-sep">·</span>')}</div>` : '';

  app.innerHTML = `
    ${offline ? '<div class="offline-bar">⚠ 오프라인 — 마지막으로 본 상태예요. 서버가 켜지면 자동으로 갱신돼요.</div>' : ''}
    ${versus}
    ${center}${undoBanner}${recent}
    ${minorRow}`;

  setFoot(offline ? '' : `<button id="switch">다른 사람으로 전환</button>`);

  if ($('#recTabList')) $('#recTabList').onclick = () => setRecView('list');
  if ($('#recTabCal')) $('#recTabCal').onclick = () => setRecView('calendar');
  if ($('#calPrev')) $('#calPrev').onclick = () => shiftMonth(-1);
  if ($('#calNext')) $('#calNext').onclick = () => shiftMonth(1);

  if ($('#buy')) $('#buy').onclick = async () => {
    busy = true;
    try { await jsonPost('/api/buy', {}, { noBusy: true }); histCache = null; calYM = null; playStamp(null, () => { busy = false; load(); }); }
    catch (e) { busy = false; toast(e.message); load(); }
  };
  if ($('#undo')) $('#undo').onclick = async () => {
    try { await jsonPost('/api/undo', {}); toast('취소 요청을 보냈어요\n상대 승인을 기다릴게요'); load(); } catch (e) { toast(e.message); }
  };
  if ($('#undoCancel')) $('#undoCancel').onclick = async () => {
    try { await jsonPost('/api/undo-cancel', {}); toast('요청을 철회했어요'); load(); } catch (e) { toast(e.message); }
  };
  if ($('#undoApprove')) $('#undoApprove').onclick = async () => {
    try { await jsonPost('/api/undo-approve', {}); histCache = null; toast('취소를 승인했어요'); load(); } catch (e) { toast(e.message); load(); }
  };
  if ($('#undoReject')) $('#undoReject').onclick = async () => {
    try { await jsonPost('/api/undo-cancel', {}); toast('취소를 거절했어요'); load(); } catch (e) { toast(e.message); }
  };
  if ($('#switch')) $('#switch').onclick = async () => {
    try { await jsonPost('/api/logout', {}); } catch {}
    setToken(''); load();
  };
  if ($('#nameMe')) $('#nameMe').onclick = () => renameMe(me.name);
  if ($('#avaMe')) $('#avaMe').onclick = pickAvatar;
  if ($('#miniBtn')) $('#miniBtn').onclick = () => setMini(true);
}

// ---------------- 미니 모드 (새 창 없이 현재 창을 컴팩트 위젯으로) ----------------
let lastState = null;   // 마지막으로 받은 상태
const MINI_KEY = 'wc_mini';
let miniMode = (() => { try { return localStorage.getItem(MINI_KEY) === '1'; } catch (e) { return false; } })();
function setMini(on) {
  miniMode = on;
  try { localStorage.setItem(MINI_KEY, on ? '1' : '0'); } catch (e) { }
  if (busyOverlay) busyOverlay.classList.add('show'); // 전환 즉시 스피너(창 리사이즈/리플로우를 덮음) → load()의 render 에서 해제
  load();
}
// 네이티브 앱(WebView2)에 창 크기 축소/복원 요청 — 브라우저면 무시됨(중복 전송 방지)
let nativeMiniSent = null;
function notifyNativeMini(want) {
  if (nativeMiniSent === want) return;
  nativeMiniSent = want;
  if (!want) lastMiniH = null; // 미니 벗어나면 다음 진입 때 높이 재전송
  // 미니 진입은 mini:on(고정 250×300 → 새로고침 때 높이가 왔다갔다) 대신 syncMiniHeight의 minih 로만 사이징(폭·높이 한 번에). 전체화면 복귀만 mini:off 전송.
  try { if (!want && window.chrome && window.chrome.webview) window.chrome.webview.postMessage('mini:off'); } catch (e) { }
}
// 미니 창 높이를 콘텐츠에 맞춤: 실제 콘텐츠 높이를 재서 네이티브에 전달 → 창이 딱 그만큼(하단 여백 최소화)
let lastMiniH = null;
function syncMiniHeight() {
  if (!isApp || !miniMode) return;
  const wrap = document.querySelector('.wrap');
  if (!wrap) return;
  const h = Math.ceil(wrap.getBoundingClientRect().bottom) + 12; // 상단 패딩 오프셋 포함 + 하단 여백
  if (h === lastMiniH) return;
  lastMiniH = h;
  try { window.chrome.webview.postMessage('minih:' + h); } catch (e) { }
}
// 항상-위(핀): 미니 모드에서만 유효, 전체화면이면 무조건 off. 앱(WebView2)에서만 노출.
const isApp = !!(window.chrome && window.chrome.webview);
if (isApp) document.documentElement.classList.add('is-app');
// 모바일 확대/축소 차단 — iOS는 user-scalable 무시하므로 핀치(gesture)를 JS로 막음(더블탭은 touch-action:manipulation이 처리)
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
const PIN_KEY = 'wc_pin';
let pinOn = (() => { try { return localStorage.getItem(PIN_KEY) === '1'; } catch (e) { return false; } })();
let nativePinSent = null;
function notifyNativePin(want) {
  if (nativePinSent === want) return;
  nativePinSent = want;
  try { if (isApp) window.chrome.webview.postMessage(want ? 'pin:on' : 'pin:off'); } catch (e) { }
}
const pinBtn = $('#pinToggle');
function refreshPinBtn() { if (pinBtn) { pinBtn.classList.toggle('on', pinOn); pinBtn.title = pinOn ? '항상 위: 켜짐' : '항상 위: 꺼짐'; } }
if (pinBtn) {
  refreshPinBtn();
  pinBtn.onclick = () => {
    pinOn = !pinOn;
    try { localStorage.setItem(PIN_KEY, pinOn ? '1' : '0'); } catch (e) { }
    refreshPinBtn();
    notifyNativePin(miniMode && pinOn); // 미니일 때만 실제 적용
  };
}

// ---------------- exe 업데이트 알림 (B안) ----------------
// exe(viewer.cs)가 window.__WC_EXE__ 에 자기 네이티브 버전을 주입.
// 웹은 항상 최신이므로 EXE_LATEST(현재 네이티브 최신 버전)와 비교해 구버전이면 배지 노출.
// 새 네이티브 exe 낼 때: viewer.cs APP_VERSION + 여기 EXE_LATEST 함께 올리고, dist exe를 public/download 로 복사해 배포.
// (자동 다운로드/자기교체는 백신 오탐(Trojan:Win32/Wacatac)으로 제거 — 배지는 다운로드 링크만 연다.)
const EXE_LATEST = '1.1.0';
const EXE_DOWNLOAD = 'https://whoscoffee.youn7084084.workers.dev/download/WHOSCOFFEE.exe';
function cmpVer(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}
function checkExeUpdate() {
  const cur = window.__WC_EXE__;      // 앱(exe)에서만 주입됨. 브라우저면 undefined → 알림 없음
  const bar = $('#updBar');
  if (!bar) return;
  if (cur && cmpVer(cur, EXE_LATEST) < 0) { bar.href = EXE_DOWNLOAD; bar.classList.add('show'); }
  else bar.classList.remove('show');
}
// 배지 클릭: 다운로드 링크 열기만 (자기교체·자동실행 없음 — 백신 오탐 방지. 사용자가 받아서 교체·재실행)
(function () {
  const bar = $('#updBar');
  if (bar) bar.href = EXE_DOWNLOAD;
})();
checkExeUpdate();

function miniIni(n) { return ((n || '?').trim().charAt(0) || '?'); }
function miniAva(mb) {
  const inner = (mb && mb.avatar) ? `<img src="${mb.avatar}" alt="" />` : `<span>${esc(miniIni(mb && mb.name))}</span>`;
  return `<div class="mav">${inner}</div>`;
}
function miniCol(mb, cur) {
  return `<div class="mcol ${cur ? 'cur' : 'dim'}">${miniAva(mb)}<div class="mnm">${esc(mb && mb.name)}</div><div class="mst">${cur ? '지금 차례' : '대기중'}</div></div>`;
}
// 미니 카드 내부 HTML (상태별) — 본앱 느낌의 컴팩트 카드
function renderMini(s, offline) {
  if (!s) return `<div class="mwait">불러오는 중…</div>`;
  if (s.phase === 'waiting') {
    return `<div class="mvs"><div class="mcol cur">${miniAva(s.me)}<div class="mnm">${esc(s.me && s.me.name)}</div></div></div><div class="mwait">상대를 기다리는 중…</div>`;
  }
  if (s.phase !== 'active') return `<div class="mwait">품앗이 종료됨</div>`;
  const myTurn = s.myTurn, me = s.me, mate = s.mate;
  const vs = `<div class="mvs">${miniCol(me, myTurn)}<span class="mswap">⇄</span>${miniCol(mate, !myTurn)}</div>`;
  const pendingOtherUndo = !offline && s.undoReq && !s.undoReq.byMe; // 상대 취소 요청 대기 → 수행 잠금
  const btn = (myTurn && !pendingOtherUndo)
    ? (offline ? `<div class="mwait">서버 꺼짐 · 도장 불가</div>` : `<button id="mbuy" class="mbuy">☕ 품앗이 수행</button>`)
    : '';
  let mundo = '';
  if (!offline && s.undoReq) {
    mundo = s.undoReq.byMe
      ? `<div class="mundo wait">⏳ 취소 요청 중 <button id="mUndoCancel">철회</button></div>`
      : `<div class="mundo">🔁 <b>${esc(s.undoReq.byName)}</b> 취소 요청<div class="mundo-acts"><button id="mUndoApprove">승인</button><button id="mUndoReject" class="ghost">거절</button></div></div>`;
  }
  return vs + btn + mundo;
}

// 미니 모드 화면 렌더 (active/waiting 일 때만 진입)
function renderMiniMode(s, offline) {
  document.body.classList.add('mini-mode'); // hideBusy는 아래 리사이즈 정착 후로 미룸(전환/새로고침 깜빡임을 오버레이로 덮음)
  app.innerHTML = `<div class="mini">${renderMini(s, offline)}</div>
    <div class="minor-row"><button id="miniExit">↩ 전체 화면</button></div>`;
  setFoot('');
  if ($('#mbuy')) $('#mbuy').onclick = async () => {
    busy = true;
    try { await jsonPost('/api/buy', {}, { noBusy: true }); histCache = null; calYM = null; playStamp(null, () => { busy = false; load(); }); }
    catch (e) { busy = false; toast(e.message); load(); }
  };
  if ($('#miniExit')) $('#miniExit').onclick = () => setMini(false);
  if ($('#mUndoApprove')) $('#mUndoApprove').onclick = async () => { try { await jsonPost('/api/undo-approve', {}); histCache = null; toast('취소 승인'); load(); } catch (e) { toast(e.message); load(); } };
  if ($('#mUndoReject')) $('#mUndoReject').onclick = async () => { try { await jsonPost('/api/undo-cancel', {}); toast('취소 거절'); load(); } catch (e) { toast(e.message); } };
  if ($('#mUndoCancel')) $('#mUndoCancel').onclick = async () => { try { await jsonPost('/api/undo-cancel', {}); toast('요청 철회'); load(); } catch (e) { toast(e.message); } };
  requestAnimationFrame(syncMiniHeight); // 렌더 후 실제 높이 측정 → 창 높이 맞춤
  setTimeout(hideBusy, 220); // 미니 레이아웃+네이티브 리사이즈가 자리잡은 뒤 오버레이 해제(깜빡임/x·y 스크롤 순간을 덮음)
}

if (busyOverlay) busyOverlay.classList.add('show', 'solid'); // 첫 로딩: 불투명 배경 + 원두 스피너(‘불러오는 중’ 텍스트 대체)
load();

// 서비스워커 등록 — 네트워크 전용(캐시 안 함) + WebAPK 설치성 + 푸시 수신 준비.
// updateViaCache:'none' → sw.js 업데이트는 항상 네트워크로 확인(신선도 보장). 캐시 정리는 SW activate 가 담당.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>
